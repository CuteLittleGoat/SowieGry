<!doctype html>
<html lang="pl" class="sowie-shell">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dff7ea" />
    <meta
      name="description"
      content="Sowie Trójki — układaj trójki liści, humbaków, kózek, truskawek i storczyków. Sówka kibicuje Ci z gałęzi!"
    />
    <title>Sowie Trójki — SowieGry</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SowieGry" />
    <script src="../config/firebase-config.js"></script>
    <script src="../shared/sowie-platform.js"></script>
    <script src="../shared/sowie-cloud.js"></script>
    <script src="../shared/password-gate.js"></script>
    <script src="../shared/pwa.js"></script>
    <link rel="preload" href="../assets/fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../shared/cute-ui.css" />
    <link rel="stylesheet" href="../shared/world/tokens.css" />
    <link rel="stylesheet" href="../shared/ui/ui.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../shared/owl-gallery.js" defer></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="trojki" data-trojki aria-label="Sowie Trójki">
      <header class="trojki-top">
        <a class="sowie-ui-button is-quiet trojki-back" href="../" data-menu-link>Menu</a>
        <button type="button" class="sowie-ui-button is-quiet trojki-back" data-to-map hidden>Mapa</button>
        <h1 class="trojki-title" data-level-title>Sowie Trójki</h1>
        <button type="button" class="sowie-ui-button is-quiet trojki-guide" data-guide aria-label="Jak grać?">?</button>
        <button type="button" class="trojki-pause" data-pause aria-label="Pauza"></button>
      </header>

      <section class="trojki-map-screen" data-map-screen aria-label="Mapa poziomów">
        <p class="trojki-preview" data-preview hidden>
          Podgląd gry: wszystkie poziomy są otwarte, a postęp nie zapisuje się jeszcze w chmurze.
        </p>
        <div class="trojki-map" data-map></div>
      </section>

      <section class="trojki-game" data-game hidden aria-label="Plansza i Sówka">
        <div class="trojki-bar">
          <div class="trojki-moves">
            <span>Ruchy</span>
            <strong data-moves>0</strong>
          </div>
          <ul class="trojki-goals" data-goals aria-label="Cele poziomu"></ul>
          <div class="trojki-score">
            <span>Punkty</span>
            <strong data-score>0</strong>
            <div class="trojki-starbar" data-stars="0" aria-hidden="true">
              <i data-star-fill></i>
            </div>
          </div>
        </div>
        <div class="trojki-board-wrap" data-board-wrap>
          <canvas class="trojki-board" data-board tabindex="0" aria-label="Plansza Sowich Trójek"></canvas>
          <div class="trojki-combo" data-combo aria-hidden="true" hidden></div>
          <div class="trojki-hand" data-hand aria-hidden="true" hidden></div>
        </div>
        <div class="trojki-owl-area" data-owl-area>
          <button type="button" class="trojki-owl-button" data-owl-button aria-label="Sówka — stuknij">
            <canvas class="trojki-owl" data-owl aria-hidden="true"></canvas>
          </button>
          <p class="trojki-bubble" data-bubble role="status" hidden></p>
          <div class="trojki-joy">
            <span>Radość Sówki</span>
            <div class="trojki-joybar" aria-hidden="true"><i data-joy></i></div>
            <button type="button" class="sowie-ui-button trojki-help" data-help disabled>Sowia pomoc</button>
          </div>
        </div>
      </section>
      <p class="trojki-live" data-live aria-live="polite"></p>
    </main>
  </body>
</html>
