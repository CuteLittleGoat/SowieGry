<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f2ff" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SowieGry" />
  <title>SowieGry — Start</title>
  <link rel="stylesheet" href="shared/cute-ui.css" />
  <link rel="stylesheet" href="shared/main-menu.css" />
  <link rel="stylesheet" href="shared/game-enhancements.css" />
  <link rel="stylesheet" href="shared/owl-gallery.css" />
</head>
<body class="sowie-main-menu">
  <main class="start-screen">
    <div class="floating-band" aria-hidden="true">
      <span class="creature owl">🦉</span>
      <span class="creature goat">🐐</span>
      <span class="creature whale">🐋</span>
      <span class="creature greenhouse">🏡</span>
    </div>
    <header>
      <div>
        <h1>SowieGry</h1>
        <p class="subtitle">Wybierz swoją przygodę — słodkie zwierzaki już czekają!</p>
      </div>
      <button id="cosmeticsButton" class="menu-button" type="button">
        <span data-cosmetic-icon aria-hidden="true">🎀</span>
        <span data-cosmetic-label>Garderoba sowy</span>
      </button>
    </header>
    <section class="cards" data-game-cards aria-label="Lista gier"></section>
    <p class="footer-note">Miłej zabawy! ✨</p>
  </main>
  <script src="config/firebase-config.js"></script>
  <script src="shared/sowie-platform.js"></script>
  <script src="shared/sowie-cloud.js"></script>
  <script src="shared/password-gate.js"></script>
  <script src="shared/pwa.js"></script>
  <script src="shared/sowie-core.js"></script>
  <script src="shared/notification-manager.js"></script>
  <script src="shared/game-guides.js"></script>
  <script src="shared/sowie-academy.js"></script>
  <script src="shared/owl-gallery.js"></script>
  <script src="shared/main-menu.js"></script>
</body>
</html>
