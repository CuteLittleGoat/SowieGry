    <linearGradient id="niebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#fff6e3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#niebo)"/>
  <ellipse cx="256" cy="420" rx="120" ry="18" fill="#3b2f4a" opacity="0.12"/>
