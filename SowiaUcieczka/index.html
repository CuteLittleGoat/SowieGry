<!doctype html>
<html lang="pl" class="sowie-shell">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe9ff" />
    <meta
      name="description"
      content="Sowia Ucieczka — biegnij przed Chmurą Pracu, skacz, szybuj i zbieraj liście monstery."
    />
    <title>Sowia Ucieczka — SowieGry</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SowieGry" />
    <script src="../config/firebase-config.js"></script>
    <script src="../shared/sowie-platform.js"></script>
    <script src="../shared/sowie-cloud.js"></script>
    <script src="../shared/password-gate.js"></script>
    <script src="../shared/pwa.js"></script>
    <link rel="preload" href="../assets/fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../shared/cute-ui.css" />
    <link rel="stylesheet" href="../shared/world/tokens.css" />
    <link rel="stylesheet" href="../shared/engine/shell.css" />
    <link rel="stylesheet" href="../shared/ui/ui.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../shared/sowie-academy.js" defer></script>
    <script src="../shared/owl-gallery.js" defer></script>
    <script type="module" src="main.js"></script>
  </head>
  <body data-sowie-game="runner">
    <main class="sowie-stage ucieczka-stage" data-stage aria-label="Sowia Ucieczka">
      <canvas data-canvas aria-hidden="true"></canvas>
      <section class="ucieczka-title" data-title aria-labelledby="ucieczka-title-heading">
        <div class="ucieczka-title-card">
          <h1 id="ucieczka-title-heading">Sowia Ucieczka</h1>
          <p class="ucieczka-title-lead">
            Uciekaj przed Chmurą Pracu! Stuknij — skok, przytrzymaj — szybowanie, przesuń w dół — ślizg.
          </p>
          <div class="ucieczka-difficulty" role="group" aria-label="Poziom trudności" data-difficulty>
            <button type="button" class="sowie-ui-chip" data-level="chill" aria-pressed="false">Chill</button>
            <button type="button" class="sowie-ui-chip" data-level="arcade" aria-pressed="true">Arcade</button>
            <button type="button" class="sowie-ui-chip" data-level="chaos" aria-pressed="false">Chaos</button>
          </div>
          <p class="ucieczka-title-record" data-record>…</p>
          <p class="ucieczka-title-note" data-cozy hidden>Tryb Przytulny: wolniej i bez końca gry.</p>
          <p class="ucieczka-title-daily" data-daily-note hidden></p>
          <button type="button" class="sowie-ui-button is-primary is-big" data-start>Start</button>
          <div class="ucieczka-title-actions">
            <button type="button" class="sowie-ui-button" data-tasks>
              Zadania <span class="ucieczka-multiplier" data-multiplier>×1</span>
            </button>
            <a class="sowie-ui-button" data-daily href="?daily=1">Wyzwanie dnia</a>
            <button type="button" class="sowie-ui-button" data-guide>Jak grać?</button>
            <button
              type="button"
              class="sowie-ui-button"
              data-tutorial-replay
              aria-label="Zagraj samouczek jeszcze raz"
            >
              Samouczek
            </button>
            <a class="sowie-ui-button is-quiet" href="../">Menu</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
