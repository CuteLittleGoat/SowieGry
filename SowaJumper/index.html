<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#bfe7ff" />
  <title>Sowa Jumper — pełna wersja arcade</title>
  <script src="../shared/progress-reset.js"></script>
  <script src="../shared/sowie-smoke-hook.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../shared/cute-ui.css" />
</head>
<body>
  <main class="game-shell" aria-label="Sowa Jumper">
    <canvas id="game" aria-label="Gra Sowa Jumper" role="img"></canvas>

    <section class="hud" aria-label="Panel gry">
      <div class="hud-card">
        <span class="hud-label">Wysokość</span>
        <strong id="heightValue" class="hud-value">0 m</strong>
      </div>
      <div class="hud-card">
        <span class="hud-label">Punkty</span>
        <strong id="scoreValue" class="hud-value">0</strong>
      </div>
      <div class="hud-card">
        <span class="hud-label">Życia</span>
        <strong id="livesValue" class="hud-value">3</strong>
      </div>
    </section>

    <div class="mobile-hints" aria-hidden="true">
      <span>◀ lewo</span>
      <span>prawo ▶</span>
    </div>

    <p class="controls">
      Dotknij lewej/prawej połowy ekranu, użyj ←/→ lub A/D. Spacja / tap na ekranie tytułowym startuje grę.
    </p>
  </main>

  <script src="script.js"></script>
  <script src="../shared/sowie-core.js"></script>
  <script src="../shared/sowie-runtime.js"></script>
  <script src="difficulty.js"></script>
  <script src="cute-loader.js"></script>
</body>
</html>
