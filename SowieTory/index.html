<!doctype html>
<html lang="pl" class="sowie-shell">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe9ff" />
    <meta
      name="description"
      content="Sowie Tory — trzy tory w głąb ekranu: sklep Biedronka, festiwal roślin, blokowisko PRL i stacja Amic."
    />
    <title>Sowie Tory — SowieGry</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SowieGry" />
    <script src="../config/firebase-config.js"></script>
    <script src="../shared/sowie-platform.js"></script>
    <script src="../shared/sowie-cloud.js"></script>
    <script src="../shared/password-gate.js"></script>
    <script src="../shared/pwa.js"></script>
    <link rel="preload" href="../assets/fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../shared/cute-ui.css" />
    <link rel="stylesheet" href="../shared/world/tokens.css" />
    <link rel="stylesheet" href="../shared/engine/shell.css" />
    <link rel="stylesheet" href="../shared/ui/ui.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../shared/owl-gallery.js" defer></script>
    <script type="module" src="main.js"></script>
  </head>
  <body data-sowie-game="sowa3">
    <main class="sowie-stage tory-stage" data-stage aria-label="Sowie Tory">
      <canvas data-canvas aria-hidden="true"></canvas>
      <section class="tory-title" data-title aria-labelledby="tory-title-heading">
        <div class="tory-title-card">
          <h1 id="tory-title-heading">Sowie Tory</h1>
          <p class="tory-title-lead">
            Trzy tory w głąb ekranu! Przesuń palcem: w bok — zmiana toru, w górę — skok, w dół — ślizg.
          </p>
          <div class="tory-mode" role="group" aria-label="Tryb gry" data-modes>
            <button type="button" class="sowie-ui-chip" data-mode="kampania" aria-pressed="true">Kampania</button>
            <button type="button" class="sowie-ui-chip" data-mode="nieskonczony" aria-pressed="false" disabled>
              Nieskończony
            </button>
          </div>
          <p class="tory-title-note" data-mode-note>Ukończ kampanię, żeby odblokować tryb Nieskończony.</p>
          <div class="tory-difficulty" role="group" aria-label="Poziom trudności" data-difficulty>
            <button type="button" class="sowie-ui-chip" data-level="chill" aria-pressed="false">Chill</button>
            <button type="button" class="sowie-ui-chip" data-level="arcade" aria-pressed="true">Arcade</button>
            <button type="button" class="sowie-ui-chip" data-level="chaos" aria-pressed="false">Chaos</button>
          </div>
          <p class="tory-title-record" data-record>…</p>
          <p class="tory-title-note" data-cozy hidden>Tryb Przytulny: wolniej i bez końca gry.</p>
          <button type="button" class="sowie-ui-button is-primary is-big" data-start>Start</button>
          <div class="tory-title-actions">
            <button type="button" class="sowie-ui-button" data-guide>Jak grać?</button>
            <button
              type="button"
              class="sowie-ui-button"
              data-tutorial-replay
              aria-label="Zagraj samouczek jeszcze raz"
            >
              Samouczek
            </button>
            <a class="sowie-ui-button is-quiet" href="../">Menu</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
