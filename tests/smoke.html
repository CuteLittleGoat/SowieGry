<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SowieGry — smoke test</title>
  <style>
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; color: #2b2733; background: #dff6ff; }
    h1 { margin-top: 0; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); }
    article { padding: 16px; border-radius: 18px; background: rgba(255,255,255,.9); box-shadow: 0 12px 28px rgba(40,70,90,.14); }
    .pending { color: #836a16; }
    .ok { color: #237b3d; }
    .bad { color: #b2273b; }
    pre { white-space: pre-wrap; font-size: 12px; }
    iframe { position: fixed; width: 390px; height: 760px; left: -2000px; top: 0; border: 0; }
  </style>
</head>
<body>
  <h1>SowieGry — test uruchomieniowy</h1>
  <p>Strona ładuje trzy gry i sprawdza najważniejsze moduły. Najlepiej otworzyć ją przez lokalny serwer HTTP albo GitHub Pages.</p>
  <div class="grid" id="results"></div>
  <script>
    const games = [
      {
        id: "runner",
        name: "SowaRunner",
        url: "../SowaRunner/",
        checks: [
          ["trzy poziomy trudności", "typeof LEVELS !== 'undefined' && LEVELS.length === 3"],
          ["główna funkcja start", "typeof start === 'function'"],
          ["dodatkowe życia", "typeof runnerLifePickups !== 'undefined'"],
          ["balans przeszkód", "typeof runnerBalancedGap === 'function'"],
          ["wspólny profil", "typeof SowieCore === 'object'"],
        ],
      },
      {
        id: "jumper",
        name: "SowaJumper",
        url: "../SowaJumper/",
        checks: [
          ["trzy poziomy trudności", "typeof JUMPER_DIFFICULTIES !== 'undefined' && Object.keys(JUMPER_DIFFICULTIES).length === 3"],
          ["główna funkcja start", "typeof startGame === 'function'"],
          ["dodatkowe życia", "typeof drawJumperHeart === 'function'"],
          ["balans platform", "typeof resetJumperSafetyState === 'function'"],
          ["bonus humbaka", "typeof drawThreeLaneBonus === 'function' || typeof drawBonus === 'function'"],
          ["wspólny profil", "typeof SowieCore === 'object'"],
        ],
      },
      {
        id: "sowa3",
        name: "Sowa3",
        url: "../Sowa3/",
        checks: [
          ["trzy poziomy trudności", "typeof SOWA3_DIFFICULTIES !== 'undefined' && Object.keys(SOWA3_DIFFICULTIES).length === 3"],
          ["główna funkcja start", "typeof startGame === 'function'"],
          ["dodatkowe życia", "typeof drawSowa3Heart === 'function'"],
          ["balans torów", "typeof pickSowa3SafeBlockerLane === 'function'"],
          ["czysty korytarz", "typeof drawSowa3GameplayCorridor === 'function'"],
          ["basen i humbak", "typeof drawReferencePool === 'function' && typeof drawFinishWhale === 'function'"],
          ["wspólny profil", "typeof SowieCore === 'object'"],
        ],
      },
    ];

    const resultRoot = document.getElementById("results");
    const frames = new Map();
    const errors = new Map();

    for (const game of games) {
      const article = document.createElement("article");
      article.id = `result-${game.id}`;
      article.innerHTML = `<h2>${game.name}</h2><p class="pending">Ładowanie…</p><pre></pre>`;
      resultRoot.appendChild(article);
      errors.set(game.id, []);

      const frame = document.createElement("iframe");
      frame.title = game.name;
      frame.src = `${game.url}?smoke=1`;
      frame.dataset.game = game.id;
      document.body.appendChild(frame);
      frames.set(game.id, frame);
    }

    function gameFromPath(path) {
      return games.find((game) => path.includes(`/${game.name}/`) || (game.id === "sowa3" && path.includes("/Sowa3/")));
    }

    function runChecks(game) {
      const frame = frames.get(game.id);
      const article = document.getElementById(`result-${game.id}`);
      const lines = [];
      let passed = 0;
      for (const [label, expression] of game.checks) {
        let ok = false;
        try { ok = Boolean(frame.contentWindow.eval(expression)); } catch (error) { errors.get(game.id).push(String(error)); }
        lines.push(`${ok ? "✅" : "❌"} ${label}`);
        if (ok) passed += 1;
      }
      const gameErrors = errors.get(game.id);
      if (gameErrors.length) lines.push("", "Błędy:", ...gameErrors);
      const allOk = passed === game.checks.length && gameErrors.length === 0;
      article.querySelector("p").className = allOk ? "ok" : "bad";
      article.querySelector("p").textContent = allOk ? "Wszystkie kontrole zaliczone" : `${passed}/${game.checks.length} kontroli zaliczonych`;
      article.querySelector("pre").textContent = lines.join("\n");
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin || event.data?.source !== "sowie-smoke") return;
      const game = gameFromPath(event.data.game || "");
      if (!game) return;
      if (event.data.type === "error") {
        errors.get(game.id).push(`${event.data.message} ${event.data.file || ""}:${event.data.line || ""}`);
      }
      if (event.data.type === "loaded") window.setTimeout(() => runChecks(game), 900);
    });

    window.setTimeout(() => {
      for (const game of games) {
        const article = document.getElementById(`result-${game.id}`);
        if (article.querySelector("p").textContent === "Ładowanie…") runChecks(game);
      }
    }, 6000);
  </script>
</body>
</html>
