name: Quality and browser tests

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Ok. 1000 testów (Chromium i WebKit na profilach telefonów) trwa ponad 35 minut — zapas na powtórki.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Emulator Firestore (firebase-tools) wymaga Javy.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Check JavaScript syntax
        run: npm run syntax

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate HTML
        run: npm run html

      - name: Run unit tests
        run: npm run test:unit

      # Testy reguł i testy przeglądarkowe biegną na emulatorze Firestore (projekt demo-sowiegry), nigdy na produkcji.
      - name: Run rules and browser tests on Firestore emulator
        run: npm run test:e2e
        # Diagnostyka zawieszeń WebKit: wyjście procesów przeglądarek (np. ostrzeżenia GStreamer) trafia do logu.
        env:
          DEBUG: pw:browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 14
