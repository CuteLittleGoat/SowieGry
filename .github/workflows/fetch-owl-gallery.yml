name: Fetch owl gallery assets

on:
  push:
    branches:
      - feature/owl-gallery-rewards
    paths:
      - .github/workflows/fetch-owl-gallery.yml

permissions:
  contents: write

jobs:
  fetch-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/owl-gallery-rewards

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and optimize owl photographs
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          photos = [
              ("sowa-01-puchata.jpg", "https://images.pexels.com/photos/13681325/pexels-photo-13681325.jpeg?cs=srgb&fm=jpg"),
              ("sowa-02-lesna.jpg", "https://images.pexels.com/photos/17213746/pexels-photo-17213746.jpeg?cs=srgb&fm=jpg"),
              ("sowa-03-na-pniu.jpg", "https://images.pexels.com/photos/25559342/pexels-photo-25559342.jpeg?cs=srgb&fm=jpg"),
              ("sowa-04-portret.jpg", "https://images.pexels.com/photos/29082522/pexels-photo-29082522.jpeg?cs=srgb&fm=jpg"),
              ("sowa-05-na-dachu.jpg", "https://images.pexels.com/photos/10586311/pexels-photo-10586311.jpeg?cs=srgb&fm=jpg"),
              ("sowa-06-zielone-tlo.jpg", "https://images.pexels.com/photos/17103408/pexels-photo-17103408.jpeg?cs=srgb&fm=jpg"),
              ("sowa-07-spojrzenie.jpg", "https://images.pexels.com/photos/33228723/pexels-photo-33228723.jpeg?cs=srgb&fm=jpg"),
              ("sowa-08-na-trawie.jpg", "https://images.pexels.com/photos/25728668/pexels-photo-25728668.jpeg?cs=srgb&fm=jpg"),
          ]

          output = Path("Obrazki")
          output.mkdir(exist_ok=True)
          for filename, url in photos:
              request = Request(url, headers={"User-Agent": "SowieGry asset fetcher/1.0"})
              with urlopen(request, timeout=60) as response:
                  image = Image.open(BytesIO(response.read()))
                  image = ImageOps.exif_transpose(image).convert("RGB")
                  image = ImageOps.fit(image, (1200, 900), method=Image.Resampling.LANCZOS)
                  image.save(output / filename, "JPEG", quality=82, optimize=True, progressive=True)
                  print(filename, (output / filename).stat().st_size)
          PY

      - name: Commit photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Obrazki/*.jpg
          git commit -m "Dodaj fotografie sów do galerii"
          git push origin HEAD:feature/owl-gallery-rewards
