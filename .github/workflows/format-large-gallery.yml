name: Format large owl gallery

on:
  push:
    branches:
      - feature/large-owl-gallery
    paths:
      - .github/workflows/format-large-gallery.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/large-owl-gallery

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Format changed text files
        run: npx prettier --write shared/owl-gallery.js tests/e2e/owl-gallery.spec.js tests/unit/owl-gallery.test.mjs Obrazki/README.md

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/owl-gallery.js tests Obrazki/README.md
          git commit -m "Sformatuj dużą Galerię Sów"
          git push origin HEAD:feature/large-owl-gallery
